# Builds the Windows and Linux release archives. A pushed tag such as v0.2.0
# also publishes them, with their checksums, as a GitHub release; a manual run
# only keeps them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release --locked
      - name: Test the desktop app
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Package
        shell: bash
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip*

  linux:
    runs-on: ubuntu-24.04
    # Built on Debian 11 (glibc 2.31) so the binary runs on most distributions
    # released since 2020.
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --release --locked
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
